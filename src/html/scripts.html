<script>
// ============================================================
// A Ray of Hope - Donor Form Scripts
// ============================================================

// State Management
const state = {
  formData: {},
  donorFormData: {},
  donationId: null,
  paymentMethod: null,
  amount: 0,
  formFields: []
};

// Initialize on page load
document.addEventListener('DOMContentLoaded', function() {
  console.log('Page loaded, initializing...');
  loadFormFields();
  setupFormEventListeners();
});

// ============================================================
// LOAD FORM FIELDS FROM DATABASE
// ============================================================

function loadFormFields() {
  console.log('Loading form fields...');
  
  google.script.run.withSuccessHandler(function(response) {
    if (response && (response.success || response.data)) {
      state.formFields = (response.data && response.data.fields) || response.fields || [];
      console.log('Loaded ' + state.formFields.length + ' form fields');
      renderFormFields();
    } else {
      showError('Failed to load form fields: ' + (response ? response.message : 'Unknown error'));
    }
  }).withFailureHandler(function(error) {
    console.error('Error loading form fields:', error);
    showError('Error loading form. Please refresh the page.');
  }).getFormFieldsClient();
}

function renderFormFields() {
  const container = document.getElementById('formFields');
  if (!container) return;
  container.innerHTML = '';
  
  state.formFields.forEach(field => {
    const group = document.createElement('div');
    group.className = 'form-group';
    
    let input;
    const requiredAttr = field.required ? ' required' : '';
    const requiredLabel = field.required ? '<span class="required">*</span>' : '';
    
    switch(field.type) {
      case 'email':
        input = `<input type="email" name="${field.field_key}" placeholder="${field.placeholder || ''}" ${requiredAttr}>`;
        break;
      case 'phone':
        input = `<input type="tel" name="${field.field_key}" placeholder="${field.placeholder || ''}" ${requiredAttr}>`;
        break;
      case 'number':
        input = `<input type="number" name="${field.field_key}" placeholder="${field.placeholder || ''}" ${requiredAttr}>`;
        break;
      case 'date':
        input = `<input type="date" name="${field.field_key}" ${requiredAttr}>`;
        break;
      case 'textarea':
        input = `<textarea name="${field.field_key}" placeholder="${field.placeholder || ''}" ${requiredAttr}></textarea>`;
        break;
      case 'dropdown':
        const options = field.options ? field.options.split(',').map(opt => opt.trim()) : [];
        input = `<select name="${field.field_key}" ${requiredAttr}>
          <option value="">Select ${field.label}</option>
          ${options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
        </select>`;
        break;
      case 'checkbox':
        input = `<input type="checkbox" name="${field.field_key}" id="${field.field_key}">`;
        break;
      default:
        input = `<input type="text" name="${field.field_key}" placeholder="${field.placeholder || ''}" ${requiredAttr}>`;
    }
    
    group.innerHTML = `
      <label for="${field.field_key}">${field.label}${requiredLabel}</label>
      ${input}
      <div class="form-error"></div>
    `;
    
    container.appendChild(group);
  });
  
  console.log('Form fields rendered');
}

// ============================================================
// FORM SUBMISSION
// ============================================================

function setupFormEventListeners() {
  const donorForm = document.getElementById('donorForm');
  if (donorForm) {
    donorForm.addEventListener('submit', function(e) {
      e.preventDefault();
      submitDonorForm();
    });
  }
}

function submitDonorForm() {
  console.log('Submitting donor form...');
  
  const formEl = document.getElementById('donorForm');
  const formData = new FormData(formEl);
  
  state.donorFormData = {
    donor_name: formData.get('donor_name') || '',
    mobile: formData.get('mobile') || '',
    email: formData.get('email') || '',
    address: formData.get('address') || '',
    city: formData.get('city') || '',
    state: formData.get('state') || '',
    pin: formData.get('pin') || '',
    country: formData.get('country') || 'India',
    company: formData.get('company') || '',
    pan: formData.get('pan') || '',
    dob: formData.get('dob') || '',
    occupation: formData.get('occupation') || ''
  };
  
  state.amount = parseFloat(formData.get('amount'));
  
  if (!state.amount || state.amount <= 0) {
    showError('Please enter a valid donation amount');
    return;
  }
  
  console.log('Validating donor data...');
  google.script.run.withSuccessHandler(function(response) {
    if (response && (response.success || response.valid)) {
      console.log('Validation passed');
      showStep('stepPaymentMethod');
    } else {
      const errs = (response && response.data && response.data.errors) || (response && response.errors) || [];
      showError('Validation failed: ' + (errs.join ? errs.join(', ') : errs));
    }
  }).withFailureHandler(function(error) {
    console.error('Validation error:', error);
    showError('Error validating form. Please check your entries.');
  }).validateDonorDataClient(state.donorFormData);
}

// ============================================================
// STEP NAVIGATION
// ============================================================

function showStep(stepId) {
  document.querySelectorAll('.step').forEach(step => {
    step.classList.remove('active');
  });
  
  const target = document.getElementById(stepId);
  if (target) {
    target.classList.add('active');
  }
  
  window.scrollTo(0, 0);
  console.log('Showing step: ' + stepId);
}

function goBackToForm() {
  showStep('stepDonorForm');
}

function goBackToPaymentMethod() {
  showStep('stepPaymentMethod');
}

function proceedToPayment() {
  const method = document.querySelector('input[name="paymentMethod"]:checked');
  
  if (!method) {
    showError('Please select a payment method');
    return;
  }
  
  state.paymentMethod = method.value;
  
  console.log('Creating donation with method: ' + state.paymentMethod);
  showSpinner(true);
  
  google.script.run.withSuccessHandler(function(response) {
    showSpinner(false);
    
    if (response && response.success) {
      const donation = response.data.donation;
      state.donationId = donation.donation_id;
      
      console.log('Donation created: ' + state.donationId);
      
      const upiEl = document.getElementById('upiAmount');
      const cardEl = document.getElementById('cardAmount');
      const cashEl = document.getElementById('cashAmount');
      if (upiEl) upiEl.textContent = '₹' + state.amount;
      if (cardEl) cardEl.textContent = '₹' + state.amount;
      if (cashEl) cashEl.textContent = '₹' + state.amount;
      
      const upiIdEl = document.getElementById('upiDonationId');
      const cardIdEl = document.getElementById('cardDonationId');
      const cashIdEl = document.getElementById('cashDonationId');
      if (upiIdEl) upiIdEl.textContent = state.donationId;
      if (cardIdEl) cardIdEl.textContent = state.donationId;
      if (cashIdEl) cashIdEl.textContent = state.donationId;
      
      if (state.paymentMethod === 'UPI') {
        loadUPIQR();
        showStep('stepUPIPayment');
      } else if (state.paymentMethod === 'CARD') {
        showStep('stepCardPayment');
      } else if (state.paymentMethod === 'CASH') {
        showStep('stepCashPayment');
      }
    } else {
      showError('Error creating donation: ' + (response ? response.message : 'Unknown error'));
    }
  }).withFailureHandler(function(error) {
    showSpinner(false);
    console.error('Error creating donation:', error);
    showError('Error creating donation. Please try again.');
  }).createDonationClient({
    donor_name: state.donorFormData.donor_name,
    mobile: state.donorFormData.mobile,
    email: state.donorFormData.email,
    address: state.donorFormData.address,
    city: state.donorFormData.city,
    state: state.donorFormData.state,
    pin: state.donorFormData.pin,
    country: state.donorFormData.country,
    company: state.donorFormData.company,
    pan: state.donorFormData.pan,
    dob: state.donorFormData.dob,
    occupation: state.donorFormData.occupation,
    amount: state.amount,
    payment_method: state.paymentMethod
  });
}

// ============================================================
// PAYMENT CONFIRMATIONS
// ============================================================

function loadUPIQR() {
  console.log('Loading UPI QR...');
  showSpinner(true);
  
  google.script.run.withSuccessHandler(function(response) {
    showSpinner(false);
    if (response && response.success) {
      const upiId = response.data.org_upi_id || response.data[response.key] || '';
      const upiIdEl = document.getElementById('upiId');
      if (upiIdEl && upiId) upiIdEl.textContent = upiId;
    }
  }).withFailureHandler(function(error) {
    showSpinner(false);
    console.error('Error loading UPI QR:', error);
  }).getConfigClient({key: 'org_upi_id'});
  
  google.script.run.withSuccessHandler(function(response) {
    if (response && response.success && response.data && response.data.org_upi_qr_url) {
      const qrContainer = document.getElementById('qrCode');
      if (qrContainer) {
        qrContainer.innerHTML = `<img src="${response.data.org_upi_qr_url}" alt="UPI QR Code">`;
      }
    }
  }).getConfigClient({key: 'org_upi_qr_url'});
}

function confirmUPIPayment() {
  console.log('Confirming UPI payment...');
  showSpinner(true);
  
  google.script.run.withSuccessHandler(function(response) {
    showSpinner(false);
    if (response && response.success) {
      console.log('UPI payment confirmed');
      showConfirmation();
    } else {
      showError('Error confirming payment: ' + (response ? response.message : 'Unknown error'));
    }
  }).withFailureHandler(function(error) {
    showSpinner(false);
    console.error('Error confirming payment:', error);
    showError('Error confirming payment. Please try again.');
  }).markPaymentPendingClient({donation_id: state.donationId});
}

function confirmCardPayment() {
  console.log('Confirming card payment...');
  showSpinner(true);
  
  google.script.run.withSuccessHandler(function(response) {
    showSpinner(false);
    if (response && response.success) {
      console.log('Card payment confirmed');
      showConfirmation();
    } else {
      showError('Error confirming payment: ' + (response ? response.message : 'Unknown error'));
    }
  }).withFailureHandler(function(error) {
    showSpinner(false);
    console.error('Error confirming payment:', error);
    showError('Error confirming payment. Please try again.');
  }).markPaymentPendingClient({donation_id: state.donationId});
}

function confirmCashPayment() {
  console.log('Confirming cash payment...');
  showSpinner(true);
  
  google.script.run.withSuccessHandler(function(response) {
    showSpinner(false);
    if (response && response.success) {
      console.log('Cash payment confirmed');
      showConfirmation();
    } else {
      showError('Error confirming payment: ' + (response ? response.message : 'Unknown error'));
    }
  }).withFailureHandler(function(error) {
    showSpinner(false);
    console.error('Error confirming payment:', error);
    showError('Error confirming payment. Please try again.');
  }).markPaymentPendingClient({donation_id: state.donationId});
}

function showConfirmation() {
  const confirmAmt = document.getElementById('confirmAmount');
  const confirmId = document.getElementById('confirmDonationId');
  const confirmMethod = document.getElementById('confirmPaymentMethod');
  const confirmStatus = document.getElementById('confirmStatus');
  
  if (confirmAmt) confirmAmt.textContent = '₹' + state.amount;
  if (confirmId) confirmId.textContent = state.donationId;
  if (confirmMethod) confirmMethod.textContent = state.paymentMethod;
  if (confirmStatus) confirmStatus.textContent = 'Awaiting Confirmation';
  
  showStep('stepConfirmation');
}

function startNewDonation() {
  const formEl = document.getElementById('donorForm');
  if (formEl) formEl.reset();
  state.donationId = null;
  state.paymentMethod = null;
  state.amount = 0;
  showStep('stepDonorForm');
}

function downloadReceipt() {
  alert('Receipt download will be available after admin confirmation.');
}

function showSpinner(show) {
  const spinner = document.getElementById('loadingSpinner');
  if (!spinner) return;
  if (show) {
    spinner.classList.add('show');
  } else {
    spinner.classList.remove('show');
  }
}

function showError(message) {
  const errorDiv = document.getElementById('errorMessage');
  if (!errorDiv) return;
  errorDiv.textContent = message;
  errorDiv.classList.add('show');
  errorDiv.style.display = 'block';
  
  console.error('Error:', message);
  setTimeout(() => {
    errorDiv.classList.remove('show');
    errorDiv.style.display = 'none';
  }, 5000);
}

function hideError() {
  const errorDiv = document.getElementById('errorMessage');
  if (errorDiv) {
    errorDiv.classList.remove('show');
    errorDiv.style.display = 'none';
  }
}

// Expose step navigation & payment functions globally on window for inline onclick handlers
window.goBackToForm = goBackToForm;
window.goBackToPaymentMethod = goBackToPaymentMethod;
window.proceedToPayment = proceedToPayment;
window.confirmUPIPayment = confirmUPIPayment;
window.confirmCardPayment = confirmCardPayment;
window.confirmCashPayment = confirmCashPayment;
window.startNewDonation = startNewDonation;
window.downloadReceipt = downloadReceipt;
window.submitDonorForm = submitDonorForm;
</script>
